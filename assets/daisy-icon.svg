<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Daisy icon">
  <!-- Simple outline daisy  replaces the photo cover for a cleaner white-site look -->
  <g fill="none" stroke="#ff9adf" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(100 100)">
      <!-- 12 elongated petals -->
      <ellipse cx="0" cy="-48" rx="14" ry="38"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(30)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(60)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(90)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(120)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(150)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(180)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(210)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(240)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(270)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(300)"/>
      <ellipse cx="0" cy="-48" rx="14" ry="38" transform="rotate(330)"/>
      <!-- Center -->
      <circle cx="0" cy="0" r="22"/>
    </g>
  </g>
</svg>
